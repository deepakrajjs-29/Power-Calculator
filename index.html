<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loginPage" class="login-container">
        <h1 class="login-header">⚡ PowerCalculator</h1>
        <p class="login-subtitle">Electricity Bill Calculator</p>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
                <span class="icon">👤</span>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            
            <button type="submit" class="login-btn">Login</button>
        </form>
        
        <a href="#" class="forgot-password"></a>
    </div>

    <div id="calculatorApp" class="container hidden">
        <button class="btn-logout" onclick="logout()">Logout</button>
        
        <h1>Electricity Bill Calculator - 30 Days</h1>
        
        <div id="step1" class="form-step active">
            <div class="form-container">
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 33%;"></div>
                </div>
                
                <div class="form-group">
                    <label>Select State:</label>
                    <select id="state">
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Kerala">Kerala</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Total Number of Rooms (Excluding Kitchen):</label>
                    <input type="number" id="totalRooms" min="1" max="20" required>
                </div>
                
                <button onclick="goToStep2()">Next</button>
            </div>
        </div>

        <div id="step2" class="form-step">
            <div class="form-container">
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 66%;"></div>
                </div>
                
                <div id="roomsContainer"></div>
                
                <div class="room-section">
                    <h3>Kitchen (Default)</h3>
                    <div class="appliance-grid">
                        <div class="appliance-item">
                            <label>Fan Brand:</label>
                            <select id="kitchenFanBrand" onchange="updateKitchenFanWattage()">
                                <option value="0">None</option>
                                <option value="75">Crompton Ceiling Fan (75W)</option>
                                <option value="60">Usha Table Fan (60W)</option>
                                <option value="70">Havells Exhaust Fan (70W)</option>
                                <option value="65">Orient Wall Fan (65W)</option>
                                <option value="90">Bajaj Pedestal Fan (90W)</option>
                            </select>
                            <small>Daily Hours: <input type="number" id="kitchenFanHours" min="0" max="24" value="8" style="width:60px; padding:5px;"></small>
                        </div>
                        <div class="appliance-item">
                            <label>Light (W):</label>
                            <input type="number" id="kitchenLight" min="0" value="0">
                            <small>Daily Hours: <input type="number" id="kitchenLightHours" min="0" max="24" value="5" style="width:60px; padding:5px;"></small>
                        </div>
                        <div class="appliance-item">
                            <label>Mixee (W):</label>
                            <input type="number" id="kitchenMixee" min="0" value="0">
                            <small>Daily Hours: <input type="number" id="kitchenMixeeHours" min="0" max="24" value="0.5" step="0.5" style="width:60px; padding:5px;"></small>
                        </div>
                        <div class="appliance-item">
                            <label>Grinder (W):</label>
                            <input type="number" id="kitchenGrinder" min="0" value="0">
                            <small>Daily Hours: <input type="number" id="kitchenGrinderHours" min="0" max="24" value="0.5" step="0.5" style="width:60px; padding:5px;"></small>
                        </div>
                        <div class="appliance-item">
                            <label>Fridge (W):</label>
                            <input type="number" id="kitchenFridge" min="0" value="0">
                            <small>Daily Hours: <input type="number" id="kitchenFridgeHours" min="0" max="24" value="24" style="width:60px; padding:5px;"></small>
                        </div>
                        <div class="appliance-item">
                            <label>Chimney (W):</label>
                            <input type="number" id="kitchenChimney" min="0" value="0">
                            <small>Daily Hours: <input type="number" id="kitchenChimneyHours" min="0" max="24" value="1" step="0.5" style="width:60px; padding:5px;"></small>
                        </div>
                        <div class="appliance-item">
                            <label>Oven (W):</label>
                            <input type="number" id="kitchenOven" min="0" value="0">
                            <small>Daily Hours: <input type="number" id="kitchenOvenHours" min="0" max="24" value="0.5" step="0.5" style="width:60px; padding:5px;"></small>
                        </div>
                        <div class="appliance-item">
                            <label>Dishwasher (W):</label>
                            <input type="number" id="kitchenDishwasher" min="0" value="0">
                            <small>Daily Hours: <input type="number" id="kitchenDishwasherHours" min="0" max="24" value="1" step="0.5" style="width:60px; padding:5px;"></small>
                        </div>
                    </div>
                </div>
                
                <button class="btn-secondary" onclick="goToStep1()">Back</button>
                <button onclick="calculateBill()">Calculate Bill</button>
            </div>
        </div>

        <div id="step3" class="form-step">
            <div class="result-container">
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 100%;"></div>
                </div>
                
                <div id="resultsContent"></div>
                
                <button class="btn-secondary" onclick="goToStep2()">Back</button>
                <button class="btn-print" onclick="window.print()">Print Bill</button>
                <button onclick="resetCalculator()">New Calculation</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
